services:
  - type: web
    name: trade-api
    runtime: python
    # 1. Install dependencies AND run database migrations
    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head
    # Apply schema migrations on EVERY boot (not just at build time), so a
    # stale DATABASE_URL or a skipped build-time migration cannot leave the
    # running app with a schema older than the models.
    startCommand: cd server 2>/dev/null || true; alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      # 2. Ensure this is overridden by your actual Neon URL in the Render Dashboard!
      - key: DATABASE_URL
        sync: false # <-- Add this to prevent Render from overwriting your Dashboard secret
      # Shared by backend (bot/deep-link config) and frontend build (deep-link button)
      - key: NEXT_PUBLIC_TELEGRAM_BOT_USERNAME
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false