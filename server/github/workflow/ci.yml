name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    # Optional: Add a PostgreSQL service container if your tests require a real DB
    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_USER: testuser
    #       POSTGRES_PASSWORD: testpass
    #       POSTGRES_DB: testdb
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install pytest and any linting tools if not in requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff (Optional but recommended)
        run: |
          # Check for syntax errors and basic code quality
          ruff check . || true

      - name: Run Pytest
        env:
          # Provide safe dummy environment variables for the CI environment
          # so the app can import without crashing on missing secrets
          APP_ENV: testing
          DATABASE_URL: sqlite:///./test_ci.db
          TELEGRAM_BOT_TOKEN: dummy_token_for_ci
          TELEGRAM_CHAT_ID: 123456789
          NEWS_API_KEY: dummy_news_key
          MIN_SETUP_SCORE: 75.0
          MAX_RISK_PERCENT: 0.5
          SUPPORTED_SYMBOLS: '["EUR/USD", "GBP/USD", "USD/JPY", "XAU/USD"]'
          SUPPORTED_TIMEFRAMES: '["15m", "30m", "1h", "4h"]'
          SCANNER_TIMEFRAMES: '["15m", "30m", "1h", "4h"]'
        run: |
          pytest tests/ -v --tb=short

      - name: Verify App Startup (Smoke Test)
        env:
          APP_ENV: testing
          DATABASE_URL: sqlite:///./test_ci.db
          TELEGRAM_BOT_TOKEN: dummy_token_for_ci
          TELEGRAM_CHAT_ID: 123456789
        run: |
          # Quick check to ensure the FastAPI app can initialize without import errors
          python -c "from app.main import app; print('✅ App imports successfully')"