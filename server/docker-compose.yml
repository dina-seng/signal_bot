version: "3.8"

services:
  forex-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forex_signal_bot
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./trade.db:/app/trade.db
    environment:
      - DATABASE_URL=sqlite:///./trade.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
